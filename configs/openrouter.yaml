# OpenRouter integration; game settings match code_default.yaml.
# Key: OPENAI_API_KEY must contain your OpenRouter key.
models:
  planner:
    model_name: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    temperature: 0
  patroller:
    model_name: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    temperature: 0
  memory:
    model_name: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    temperature: 0
  percipient_question:
    model_name: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    temperature: 0

embeddings:
  model_name: openai/text-embedding-3-small
  base_url: https://openrouter.ai/api/v1

percipient:
  answer_method: active
  answer_model: mllm
  mllm_url: ""
  gpt_vision_model: gpt-4-vision-preview
  gpt_vision_base_url: https://api.openai.com/v1

env:
  task_id: harvest
  target_names: diamond
  target_quantities: 100
  image_size: [512, 820]
  env_seed: 3
  specified_biome: forest
  spawn_rate: 1
  break_speed_multiplier: 100.0
  spawn_range_low: [-10, -10, -10]
  spawn_range_high: [10, 10, 10]
  start_at_night: false
  world_seed: null
  use_voxel: true
  voxel_radius: 5
  use_lidar: true
  lidar_pitch: [-60, 60, 5]
  lidar_yaw: [-60, 60, 5]
  lidar_range: 10
  start_inventory:
    - {slot: 9, name: dirt, variant: null, quantity: 6}
    - {slot: 16, name: coal, variant: null, quantity: 3}
    - {slot: 17, name: coal, variant: null, quantity: 3}
  warmup_action: [0, 0, 0, 12, 6, 0, 0, 0]

eval:
  max_steps: 12000
  max_subgoal_retries: 300
  save_frames: false
  save_perception_images: true
