# Runtime defaults for lfnav. Scratch paths stay out of git.
netid: ${USER}
paths:
  root: /scratch/${USER}/lfnav
  data: /scratch/${USER}/lfnav/data
  features: /scratch/${USER}/lfnav/features
  checkpoints: /scratch/${USER}/lfnav/checkpoints
  runs: /scratch/${USER}/lfnav/runs
  logs: /scratch/${USER}/lfnav/logs

labels_file: lfnav/labels.yaml
difficulty_file: configs/lfnav/difficulty.yaml
obs_keys_file: configs/lfnav/obs_keys.yaml
actions_file: configs/lfnav/actions.yaml

image_hw: [224, 364]
patch: 14
# Unconfirmed until lfnav/gt/calibrate_camera.py is run on a real client.
fov_deg: 70
fov_axis: vertical
# Optional full pinhole. When set, aligned rays unproject patch centres with fx,fy,cx,cy.
# width/height are the capture size; they are scaled onto image_hw when aspects match.
# intrinsics:
#   fx: 365.6
#   fy: 365.6
#   cx: 410.0
#   cy: 256.0
#   width: 820
#   height: 512
camera_calib:
  bottom_frac: 0.18
  crosshair_frac: 0.03
  hand_width_frac: 0.22
  hand_height_frac: 0.28
  grad_min: 8
  ransac_px: 4.0
  pig_h_deg: [320, 30]
  pig_s: [0.22, 0.90]
  pig_v: [0.40, 1.0]
  pig_frac: 0.08
  hud_ignore_frac: 0.5
  iou_good: 0.5
aligned_ray_range: 16
# n×n sub-rays per image patch. 1 is the old patch-centre ray.
aligned_subrays: 3
wide_ray_range: 32
wide_lidar: true
# Extra rings look down (MineDojo pitch+ is up) so short mobs are not missed over the head.
wide_pitches_deg: [0, -3, -8]

match:
  tau_obj: 0.5
  tau_cond: 0.5
  tau_near: 0.5
  stop_mode: sr_b
  stop_rule: nearest
  smooth_n: 1

judge:
  radius: 3.0
  max_steps: 3000
  gt_tau: 0.5

distance_bins:
  near: 3.0
  mid: 10.0

# sun_brightness >= time_day_min is day. light_level >= brightness_min_light is sufficient.
# Leave null until lfnav/gt/calibrate_env_state.py has been run; the judge then
# marks time/brightness unknown instead of failing the condition silently.
time_day_min: 0.42          # calibrate_env_state 2026-11-08: midpoint of night vs day sun_brightness
brightness_min_light: 13    # calibrate_env_state 2026-11-08: midpoint of night vs day light_level

joint:
  lambda_c2: 1.0
  hidden: 256
  chunk: 4
  recent_k: 4
  data_version: joint_v1
  checkpoint: null
  encoder: dinov2_vits14
  token_pool: 2

c2:
  checkpoint: null
  wide_weight: 0.5
  hidden: 256
  # Main demos: keep if hostile_seen == 0. peaceful_sent is not the filter.
  exclude_tasks: ["4-3"]
  legacy_tasks: []
  demo_dirs:
    - /scratch/${USER}/lfnav/data/demos_main

policy:
  chunk: 4
  recent_k: 8
  memory_size: 15
  dagger: false
  c1_opening_scan: true
  c1_eight_sectors: true
  c1_mid_cap: 2
  c1_lost_horizon: 20
  c1_recover_scan: true
  skip_visits_when_stuck: true

perception:
  encoder: dinov2_vits14
  mineclip_dir: /scratch/${USER}/models/mineclip

difficulty: easy
backend: fake
seed: 0
# Wide lidar is privileged (expert / initial difficulty). Evaluation policies
# do not read it unless this flag is on.
policy_sees_wide_lidar: false
gradle:
  master: /scratch/${USER}/.gradle
  worker_copies: false
frames:
  enabled: true
  every: 20
  format: jpg
  quality: 80
  scale: 0.5
  max_per_episode: 400
  annotate: true
# Off: every episode calls make() with world_seed equal to that episode's seed, then close().
# On: consecutive episodes of the same task and difficulty keep one process and call reset().
# The world seed is then only the first episode's seed. Later seeds do not rebuild the world.
reuse_env: false

# Simulator settings passed to minedojo.make. Perception still uses image_hw above.
# harvest + diamond x100 matches the original MP5 env: the target is not reached
# during navigation, and the meta-task accepts scene arguments.
# Lidar ray angles are omitted until lfnav/env/inspect_minedojo.py confirms the names.
minedojo:
  task_id: harvest
  target_names: diamond
  target_quantities: 100
  image_size: [512, 820]
  seed: 3
  specified_biome: forest
  spawn_rate: 1
  break_speed_multiplier: 100.0
  spawn_range_low: [-10, -10, -10]
  spawn_range_high: [10, 10, 10]
  start_at_night: false
  use_voxel: true
  voxel_radius: 5
  use_lidar: true
  # HarvestMeta reset-hook /summon does not spawn. lfnav summons after reset.
  spawn_via_reset_hook: false
  settle_ticks: 5
  clear_entities: true
  peaceful: false
  spawn_drop_height: 2
  spawn_resistance: true
  freeze_mobs: true
  clear_vegetation: true
  settle_after_spawn: 20
  spawn_verify_retry: false
  verify_ticks: 10
  spawn_retries: 3
  distractor_mobs: [sheep, chicken, cow, pig]
  # Names from HarvestMeta via inspect_minedojo.py (MetaTaskName2Class["harvest"]).
  param_names:
    biome: specified_biome
    time: start_at_night
    weather: initial_weather
    mobs: initial_mobs
    mob_range_low: initial_mob_spawn_range_low
    mob_range_high: initial_mob_spawn_range_high
  time_values:
    day: false
    night: true
