# Observation key paths. null means the real MineDojo name is not confirmed.
# Run lfnav/gt/probe_obs.py inside the MineDojo container and fill the nulls.
# The fake environment writes whatever paths are set here, so tests and the
# real client share one mapping.
confirmed: false
rgb: rgb
position: [location_stats, pos]
yaw: [location_stats, yaw]
pitch: [location_stats, pitch]
voxels: [voxels, block_name]
aligned_rays: lfnav_rays
wide_rays: lfnav_wide_rays
# Parallel arrays inside obs["rays"], filled from the harvest_milk probe dump.
# Keys: block_name, block_distance, entity_name, entity_distance, ray_yaw, ray_pitch.
# A miss is the string "air" (block) or "null" (entity). Both still carry a large
# distance (~308); the name is what marks the miss, not a missing array slot.
ray_fields:
  block_name: block_name
  block_distance: block_distance
  entity_name: entity_name
  entity_distance: entity_distance
  yaw: ray_yaw
  pitch: ray_pitch
  miss_names: ["air", "null", "", "none"]
# Direct name keys stay null. The fake env still writes them when a test sets the path.
# Numeric fields match MP5's location_stats dump (biome_id, is_raining, light_level,
# sun_brightness, sky_light_level). Time uses sun_brightness, not the clock tick.
biome_name: null
biome_id: [location_stats, biome_id]
time_name: null
time_of_day: [location_stats, sun_brightness]
weather_name: null
weather_rain: [location_stats, is_raining]
brightness_name: null
light_level: [location_stats, light_level]
sky_light_level: [location_stats, sky_light_level]
# Minecraft 1.11 candidates. lfnav/gt/calibrate_env_state.py overwrites this
# with ids read from specified_biome. Unlisted ids decode as unknown, not "other",
# until the script has been run.
biome_id_to_name:
  1: plains
  2: desert
  4: forest
  5: taiga
  6: other
  21: jungle
  27: other
  29: other
  35: savanna
