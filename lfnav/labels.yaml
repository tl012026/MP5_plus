# Label vocabulary for Track A. Extra names are allowed.
objects:
  - tree
  - grass
  - water
  - pig
  - cow
  - sheep
  - chicken
  - sand
biomes:
  - forest
  - plains
  - desert
  - savanna
  - taiga
  - jungle
  - other
time:
  - day
  - night
weather:
  - clear
  - rain
brightness:
  - sufficient
  - insufficient
directions:
  - left
  - center
  - right
distances:
  near: 3
  mid: 10
  far: null
# Case-insensitive substrings of MineDojo block and entity names.
# log/leaves/wood are trees. tallgrass and grass are grass. flowing_water and water are water.
aliases:
  tree: [log, leaves, wood]
  grass: [tallgrass, grass]
  water: [flowing_water, water]
  sand: [sand]
  pig: [pig]
  cow: [cow]
  sheep: [sheep]
  chicken: [chicken]
